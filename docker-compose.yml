# Local PostgreSQL for development and integration tests.
# Host port 5433 avoids clashing with a Postgres already running on 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tablequeue
      POSTGRES_PASSWORD: tablequeue
      POSTGRES_DB: tablequeue
    ports:
      - "5433:5432"
    volumes:
      - tablequeue-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tablequeue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tablequeue-db:
